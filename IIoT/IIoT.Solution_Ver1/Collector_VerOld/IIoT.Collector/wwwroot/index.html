<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IIoT Collector — 실시간 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #c9d1d9; font-family: 'Consolas', monospace; font-size: 13px; }
  header { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 20px;
           display: flex; align-items: center; gap: 12px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #888; }
  .status-dot.connected { background: #3fb950; }
  .status-dot.error     { background: #e05050; }
  h1 { font-size: 15px; font-weight: 600; color: #f0f6fc; }
  .sub { color: #8b949e; font-size: 11px; }
  .container { display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
               background: #30363d; height: calc(100vh - 49px); }
  .panel { background: #0d1117; display: flex; flex-direction: column; }
  .panel-header { background: #161b22; border-bottom: 1px solid #30363d;
                  padding: 8px 14px; font-size: 11px; font-weight: 600;
                  color: #8b949e; display: flex; justify-content: space-between; }
  .panel-header span { color: #3fb950; }
  .panel-body { flex: 1; overflow-y: auto; padding: 0; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #161b22; color: #8b949e; font-size: 10px; font-weight: 600;
       padding: 6px 10px; text-align: left; border-bottom: 1px solid #30363d;
       position: sticky; top: 0; }
  td { padding: 5px 10px; border-bottom: 1px solid #21262d; }
  tr:hover td { background: #1c2128; }
  .good    { color: #3fb950; }
  .bad     { color: #e05050; }
  .warn    { color: #ef9f27; }
  .mono    { font-family: 'Consolas', monospace; color: #58a6ff; }
  .alarm-hh { color: #e05050; font-weight: 700; }
  .alarm-h  { color: #ef9f27; }
  .alarm-l  { color: #4c9fd4; }
  .alarm-ll { color: #aa66ff; font-weight: 700; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 10px;
           font-size: 10px; font-weight: 600; }
  .badge-active   { background: #2a1414; color: #e05050; }
  .badge-acked    { background: #1c1c1c; color: #8b949e; }
  .badge-recovered{ background: #0d2214; color: #3fb950; }
  #log { background: #0d1117; padding: 8px; font-size: 11px; color: #8b949e;
         height: 100%; overflow-y: auto; }
  .log-line { margin: 1px 0; }
  .log-line.tag   { color: #3fb950; }
  .log-line.alarm { color: #e05050; }
  .log-line.info  { color: #8b949e; }
</style>
</head>
<body>
<header>
  <div id="dot" class="status-dot"></div>
  <div>
    <h1>🏭 IIoT Collector — 실시간 대시보드</h1>
    <div class="sub" id="status-text">연결 중...</div>
  </div>
  <div style="margin-left:auto; color:#8b949e; font-size:11px">
    <span id="count-tag">Tag: 0</span> &nbsp;|&nbsp;
    <span id="count-alarm" style="color:#e05050">Alarm: 0</span>
  </div>
</header>

<div class="container">
  <!-- Tag 값 패널 -->
  <div class="panel">
    <div class="panel-header">
      📊 Tag 값 실시간 <span id="tag-count">0</span>
    </div>
    <div class="panel-body">
      <table>
        <thead>
          <tr>
            <th>PLC</th><th>Tag ID</th><th>Raw</th><th>Eng</th>
            <th>단위</th><th>품질</th><th>갱신</th>
          </tr>
        </thead>
        <tbody id="tag-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- 알람 패널 -->
  <div class="panel">
    <div class="panel-header">
      🔔 알람 이벤트 <span id="alarm-count">0</span>
    </div>
    <div class="panel-body">
      <table>
        <thead>
          <tr>
            <th>레벨</th><th>상태</th><th>Tag</th>
            <th>메시지</th><th>시각</th>
          </tr>
        </thead>
        <tbody id="alarm-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ── 상태 관리
const tags   = {};   // tagId → 최신 데이터
const alarms = [];   // 최근 알람 200건

let tagCount   = 0;
let alarmCount = 0;

// ── SignalR 연결
const conn = new signalR.HubConnectionBuilder()
    .withUrl("/iiot")
    .withAutomaticReconnect([1000, 3000, 5000, 10000])
    .build();

conn.on("TagValue", (d) => {
    tags[d.tagId] = d;
    renderTags();
});

conn.on("AlarmChanged", (d) => {
    alarms.unshift(d);
    if (alarms.length > 200) alarms.pop();
    alarmCount++;
    document.getElementById("count-alarm").textContent = `Alarm: ${alarmCount}`;
    document.getElementById("alarm-count").textContent = alarmCount;
    renderAlarms();
});

conn.onreconnecting(() => setStatus(false, "재연결 중..."));
conn.onreconnected(() => setStatus(true, "연결됨"));
conn.onclose(() => setStatus(false, "연결 끊김"));

function setStatus(ok, msg) {
    document.getElementById("dot").className = `status-dot ${ok ? "connected" : "error"}`;
    document.getElementById("status-text").textContent = msg;
}

async function start() {
    try {
        await conn.start();
        setStatus(true, `연결됨 — ws://${location.host}/iiot`);
    } catch(e) {
        setStatus(false, "연결 실패: " + e.message);
        setTimeout(start, 3000);
    }
}

// ── 렌더링
function renderTags() {
    const rows = Object.values(tags);
    tagCount = rows.length;
    document.getElementById("tag-count").textContent = tagCount;
    document.getElementById("count-tag").textContent = `Tag: ${tagCount}`;

    const tb = document.getElementById("tag-tbody");
    tb.innerHTML = rows.map(d => {
        const qClass = d.quality === "Good" ? "good" : "bad";
        const ts = new Date(d.ts).toLocaleTimeString("ko-KR");
        return `<tr>
            <td>${d.plcId}</td>
            <td>${d.tagId}</td>
            <td class="mono">${d.rawValue?.toFixed(2) ?? "—"}</td>
            <td class="mono">${d.engValue?.toFixed(2) ?? "—"}</td>
            <td>${d.unit || "—"}</td>
            <td class="${qClass}">${d.quality}</td>
            <td style="color:#8b949e">${ts}</td>
        </tr>`;
    }).join("");
}

function renderAlarms() {
    const tb = document.getElementById("alarm-tbody");
    tb.innerHTML = alarms.slice(0, 100).map(d => {
        const lvlClass = {HH:"alarm-hh", H:"alarm-h", L:"alarm-l", LL:"alarm-ll"}[d.level] || "";
        const stBadge  = {Active:"badge-active", Acked:"badge-acked", Recovered:"badge-recovered"}[d.status] || "";
        const ts = new Date(d.ts).toLocaleTimeString("ko-KR");
        return `<tr>
            <td class="${lvlClass}">${d.level}</td>
            <td><span class="badge ${stBadge}">${d.status}</span></td>
            <td>${d.tagName || d.tagId}</td>
            <td style="color:#c9d1d9">${d.message || "—"}</td>
            <td style="color:#8b949e">${ts}</td>
        </tr>`;
    }).join("");
}

start();
</script>
</body>
</html>
