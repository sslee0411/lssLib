*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

#zlb{font-size:11px;color:var(--tx-secondary);}

.bw{position:absolute;z-index:1;}

.uh td{padding:5px 7px;border-bottom:2px solid var(--bd-primary);white-space:normal;}
.sep td{background:var(--bg-tertiary);font-size:9px;color:var(--tx-tertiary);padding:1px 7px;}
.thr td{font-size:9px;color:var(--tx-tertiary);background:var(--bg-secondary);padding:1px 7px;}
.cn{font-weight:700;font-size:11px;color:var(--tx-primary);}
.ct{font-size:9px;color:var(--tx-secondary);}
.cex{font-size:9px;color:var(--tx-tertiary);}
.mt{color:var(--tx-info);font-size:10px;}
.mn{color:var(--tx-primary);}
.md{color:var(--tx-secondary);font-size:10px;}
.mm{color:var(--tx-warning);font-size:9px;margin-right:2px;}
.mab{font-style:italic;opacity:0.70;}
.ev{color:var(--tx-success);}

<script>
'use strict';
let zl = 0.52;
function sz(z) {
  zl = Math.min(2, Math.max(0.2, z));
  const cv = document.getElementById('cv');
  const ph = document.getElementById('cv-phantom');
  cv.style.transform = 'scale(' + zl + ')';
  const nw = parseFloat(cv.style.minWidth)  || 6000;
  const nh = parseFloat(cv.style.minHeight) || 3000;
  ph.style.width  = Math.ceil(nw * zl) + 'px';
  ph.style.height = Math.ceil(nh * zl) + 'px';
  document.getElementById('zlb').textContent = Math.round(zl * 100) + '%';
}
const H = s => (s || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function ctbl(kind, name, desc, members, ext, tw) {
  tw = tw || 400; ext = ext || '';
  const bm = { interface:'bi', abstract:'ba', class:'bc', enum:'be', 'record struct':'br', record:'br' };
  const lm = { interface:'«interface»', abstract:'«abstract»', class:'«class»', enum:'«enum»', 'record struct':'«record»', record:'«record»' };
  const tc = { interface:'ut-interface', abstract:'ut-abstract', class:'ut-class', enum:'ut-enum', 'record struct':'ut-record', record:'ut-record' };
  const hc = { interface:'uh-interface', abstract:'uh-abstract', class:'uh-class', enum:'uh-enum', 'record struct':'uh-record', record:'uh-record' };
  const ex = ext ? ' <span class="cex">: ' + H(ext) + '</span>' : '';
  const w1 = 72, w2 = 170, w3 = tw - w1 - w2 - 4;
  let rows = '';
  members.forEach(function(m) {
    if (m.s) { rows += '<tr class="sep"><td colspan="3">' + m.s + '</td></tr>'; return; }
    const ab = m.mo === 'abstract', ev = m.mo === 'event';
    const mo = (m.mo && !ev) ? '<span class="mm">' + m.mo + '</span>' : '';
    rows += '<tr><td style="width:' + w1 + 'px" class="' + (ev ? 'ev' : 'mt') + (ab ? ' mab' : '') + '">' + H(m.t || '') + '</td>' +
      '<td style="width:' + w2 + 'px" class="mn' + (ab ? ' mab' : '') + '">' + mo + H(m.n) + '</td>' +
      '<td style="width:' + w3 + 'px" class="md">' + (m.d || '') + '</td></tr>';
  });
  return '<table class="ut ' + (tc[kind] || 'ut-class') + '" style="width:' + tw + 'px">' +
    '<tr class="' + (hc[kind] || 'uh-class') + '"><td colspan="3">' +
    '<span class="bx ' + (bm[kind] || 'bc') + '">' + (lm[kind] || kind) + '</span>' +
    '<span class="cn"> ' + H(name) + '</span>' + ex +
    '<span class="ct"> ' + desc + '</span></td></tr>' +
    '<tr class="thr"><td>Type</td><td>Member</td><td>Notes</td></tr>' + rows + '</table>';
}

    {t:'string',mo:'override',n:'BuildSelectPrefix(limit)',d:'"SELECT"'},
    {t:'string',mo:'override',n:'BuildLimitClause(count)',d:'"AND ROWNUM &lt;= {count}" (WHERE 절 후행)'},
  ],'QueryBuilderBase',440),

  // ── Col 7: MySql Provider ─────────────────────────────────────────
  'MySqlDbContext': ctbl('class','MySqlDbContext','MySQL/MariaDB DbContext · MySqlConnector 완전 비동기 (sealed)',[
    {t:'DbProviderType',n:'ProviderType',d:'DbProviderType.MySql'},
    {t:'IDbConnection',mo:'override',n:'CreateConnection()',d:'new MySqlConnection(connStr)'},
    {t:'Task',mo:'override',n:'OpenConnectionAsync(conn, ct)',d:'MySqlConnection.OpenAsync()'},
  ],'DbContextBase',390),

  'MySqlRepositoryT': ctbl('class','MySqlRepository&lt;T&gt;','MySQL Repository · RepositoryBase CRUD 전용 (sealed)',[
    {t:'',n:'ctor(context: MySqlDbContext, mapper)',d:'추가 확장 없음 — RepositoryBase 공통 CRUD 사용'},
  ],'RepositoryBase&lt;T&gt;',390),

  'MySqlQueryBuilder': ctbl('class','MySqlQueryBuilder','MySQL 쿼리 빌더 · @ParamName / LIMIT N (sealed)',[
    {t:'string',mo:'override',n:'ParamPrefix { get; }',d:'"@"'},
    {t:'string',mo:'override',n:'BuildSelectPrefix(limit)',d:'"SELECT"'},
    {t:'string',mo:'override',n:'BuildLimitClause(count)',d:'"LIMIT {count}" (SELECT 후행)'},
  ],'QueryBuilderBase',390),

  // ── Col 8: SQLite Provider ────────────────────────────────────────
  'SqliteDbContext': ctbl('class','SqliteDbContext','SQLite DbContext · 파일 기반 경량 DB · SP 미지원 (sealed)',[
    {t:'DbProviderType',n:'ProviderType',d:'DbProviderType.Sqlite'},
    {t:'IDbConnection',mo:'override',n:'CreateConnection()',d:'new SqliteConnection(connStr)'},
    {s:'── SQLite 전용 — 테이블 초기화'},
    {t:'Task&lt;DbResult&lt;int&gt;&gt;',n:'EnsureTableAsync(createSql, ct)',d:'CREATE TABLE IF NOT EXISTS'},
    {t:'Task&lt;DbResult&lt;int&gt;&gt;',n:'EnsureTablesAsync(sqls, ct)',d:'여러 테이블 한 번에 초기화'},
    {s:'── SQLite 전용 — PRAGMA'},
    {t:'Task&lt;DbResult&lt;int&gt;&gt;',n:'SetPragmaAsync(pragma, value, ct)',d:'journal_mode=WAL / foreign_keys=ON 등'},
    {t:'Task&lt;string&gt;',n:'GetPragmaAsync(pragma, ct)',d:'PRAGMA 값 조회'},
    {s:'── 파일 정보'},
    {t:'string',n:'DbFilePath { get; }',d:'Data Source 경로 추출'},
    {t:'bool',n:'DbFileExists { get; }',d:'DB 파일 존재 여부'},
    {s:'── SP 미지원'},
    {t:'',n:'CallSpCoreAsync → Fail',d:'"SQLite는 SP 미지원"'},
  ],'DbContextBase',400),

  'SqliteRepositoryT': ctbl('class','SqliteRepository&lt;T&gt;','SQLite Repository · RepositoryBase + Upsert 확장 (sealed)',[
    {t:'',n:'ctor(context: SqliteDbContext, mapper)',d:''},
    {s:'── SQLite 전용 확장'},
    {t:'Task&lt;DbResult&lt;int&gt;&gt;',n:'UpsertAsync(table, columns, ct)',d:'INSERT OR REPLACE · 중복 시 교체'},
    {t:'Task&lt;DbResult&lt;int&gt;&gt;',n:'InsertIgnoreAsync(table, columns, ct)',d:'INSERT OR IGNORE · 중복 시 무시'},
  ],'RepositoryBase&lt;T&gt;',400),

  'SqliteQueryBuilder': ctbl('class','SqliteQueryBuilder','SQLite 쿼리 빌더 · @ParamName / LIMIT N (sealed)',[
    {t:'string',mo:'override',n:'ParamPrefix { get; }',d:'"@" ($, : 도 동작)'},
    {t:'string',mo:'override',n:'BuildSelectPrefix(limit)',d:'"SELECT"'},
    {t:'string',mo:'override',n:'BuildLimitClause(count)',d:'"LIMIT {count}"'},
  ],'QueryBuilderBase',400),
};

const COL = {
  0: ['DbProviderType','DbResultStatus','DbErrorCode','DbParamType','QueryOp'],
  1: ['DbConfigBase','RelationalDbConfig','InfluxDbConfig','DbConfigException','DbParam','DbResultT','SpResult','DbException'],
  2: ['IDbContext','IRepositoryT','IQueryBuilder','DbHelper'],
  3: ['DbContextBase','RepositoryBaseT','QueryBuilderBase'],
  4: ['InfluxDbContext','InfluxRepositoryT','LineProtocolBuilder'],
  5: ['MsSqlDbContext','MsSqlRepositoryT','MsSqlQueryBuilder'],
  6: ['OracleDbContext','OracleRepositoryT','OracleQueryBuilder'],
  7: ['MySqlDbContext','MySqlRepositoryT','MySqlQueryBuilder'],
  8: ['SqliteDbContext','SqliteRepositoryT','SqliteQueryBuilder'],
};

const FG = [
  { lbl:'lssLib.DB  Core Enums', ns:['DbProviderType','DbResultStatus','DbErrorCode','DbParamType','QueryOp'], color:'#dc2626' },
  { lbl:'lssLib.DB  Core Types', ns:['DbConfigBase','RelationalDbConfig','InfluxDbConfig','DbConfigException','DbParam','DbResultT','SpResult','DbException'], color:'#7c3aed' },
  { lbl:'lssLib.DB  Contracts', ns:['IDbContext','IRepositoryT','IQueryBuilder'], color:'#2563eb' },
  { lbl:'lssLib.DB  Abstractions + Helper', ns:['DbContextBase','RepositoryBaseT','QueryBuilderBase','DbHelper'], color:'#d97706' },
  { lbl:'lssLib.DB.InfluxDB', ns:['InfluxDbContext','InfluxRepositoryT','LineProtocolBuilder'], color:'#0891b2' },
  { lbl:'lssLib.DB.MsSql', ns:['MsSqlDbContext','MsSqlRepositoryT','MsSqlQueryBuilder'], color:'#059669' },
  { lbl:'lssLib.DB.Oracle', ns:['OracleDbContext','OracleRepositoryT','OracleQueryBuilder'], color:'#e85c00' },
  { lbl:'lssLib.DB.MySql', ns:['MySqlDbContext','MySqlRepositoryT','MySqlQueryBuilder'], color:'#0077c0' },
  { lbl:'lssLib.DB.Sqlite', ns:['SqliteDbContext','SqliteRepositoryT','SqliteQueryBuilder'], color:'#7c5700' },
];

const CONN = [
  // ── 설정 상속 (Col 1 내부 세로)
  { f:'RelationalDbConfig', fe:'top', t:'DbConfigBase', te:'bottom', ty:'ext', lbl:'extends', xoff:-18 },
  { f:'InfluxDbConfig',     fe:'top', t:'DbConfigBase', te:'bottom', ty:'ext', lbl:'extends', xoff:18 },

  // ── 추상 클래스 → 계약 implements (Col 3 → Col 2 수평)
  { f:'DbContextBase',   fe:'left', t:'IDbContext',   te:'right', ty:'impl', lbl:'implements' },
  { f:'RepositoryBaseT', fe:'left', t:'IRepositoryT', te:'right', ty:'impl', lbl:'implements' },
  { f:'QueryBuilderBase',fe:'left', t:'IQueryBuilder', te:'right', ty:'impl', lbl:'implements' },

  // ── InfluxDB Provider → 추상 클래스 extends (Col 4 → Col 3)
  { f:'InfluxDbContext',   fe:'left', t:'DbContextBase',    te:'right', ty:'ext', lbl:'extends' },
  { f:'InfluxRepositoryT', fe:'left', t:'RepositoryBaseT',  te:'right', ty:'ext', lbl:'extends' },

  // ── MsSql Provider → 추상 클래스 (Col 5 → Col 3)
  { f:'MsSqlDbContext',   fe:'left', t:'DbContextBase',   te:'right', ty:'ext', lbl:'extends' },
  { f:'MsSqlRepositoryT', fe:'left', t:'RepositoryBaseT', te:'right', ty:'ext', lbl:'extends' },
  { f:'MsSqlQueryBuilder',fe:'left', t:'QueryBuilderBase',te:'right', ty:'ext', lbl:'extends' },

  // ── Oracle Provider → 추상 클래스 (Col 6 → Col 3)
  { f:'OracleDbContext',   fe:'left', t:'DbContextBase',   te:'right', ty:'ext', lbl:'extends' },
  { f:'OracleRepositoryT', fe:'left', t:'RepositoryBaseT', te:'right', ty:'ext', lbl:'extends' },
  { f:'OracleQueryBuilder',fe:'left', t:'QueryBuilderBase',te:'right', ty:'ext', lbl:'extends' },

  // ── MySql Provider → 추상 클래스 (Col 7 → Col 3)
  { f:'MySqlDbContext',   fe:'left', t:'DbContextBase',   te:'right', ty:'ext', lbl:'extends' },
  { f:'MySqlRepositoryT', fe:'left', t:'RepositoryBaseT', te:'right', ty:'ext', lbl:'extends' },
  { f:'MySqlQueryBuilder',fe:'left', t:'QueryBuilderBase',te:'right', ty:'ext', lbl:'extends' },

  // ── SQLite Provider → 추상 클래스 (Col 8 → Col 3)
  { f:'SqliteDbContext',   fe:'left', t:'DbContextBase',   te:'right', ty:'ext', lbl:'extends' },
  { f:'SqliteRepositoryT', fe:'left', t:'RepositoryBaseT', te:'right', ty:'ext', lbl:'extends' },
  { f:'SqliteQueryBuilder',fe:'left', t:'QueryBuilderBase',te:'right', ty:'ext', lbl:'extends' },

  // ── InfluxDB 내부 — LineProtocolBuilder 사용
  { f:'InfluxDbContext',   fe:'bottom', t:'LineProtocolBuilder', te:'top', ty:'uses', lbl:'uses' },
  { f:'InfluxRepositoryT', fe:'bottom', t:'LineProtocolBuilder', te:'top', ty:'uses', lbl:'uses' },

  // ── DbHelper → IDbContext uses
  { f:'DbHelper', fe:'left', t:'IDbContext', te:'right', ty:'uses', lbl:'uses' },
];

const GAP_COL = 110, PAD_STACK = 50, START_X = 30, START_Y = 40;

const cv = document.getElementById('cv');
const svgEl = document.getElementById('svg');

Object.keys(BOXES).forEach(function(name) {
  const div = document.createElement('div');
  div.className = 'bw'; div.dataset.box = name;
  div.style.left = '0px'; div.style.top = '0px';
  div.innerHTML = BOXES[name];
  cv.insertBefore(div, svgEl);
});

const gb = function(n) { const el = cv.querySelector('[data-box="' + n + '"]'); return el ? {el:el,x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight} : null; };
const bot = function(n) { const b = gb(n); return b ? b.y + b.h : 0; };
const setX = function(n,x) { const el = cv.querySelector('[data-box="' + n + '"]'); if(el) el.style.left = x+'px'; };
const setY = function(n,y) { const el = cv.querySelector('[data-box="' + n + '"]'); if(el) el.style.top = y+'px'; };
const ri = function(v) { return Math.round(v); };

requestAnimationFrame(function() { requestAnimationFrame(function() {
  const colW = {};
  Object.entries(COL).forEach(function([ci,ns]) {
    colW[ci] = Math.max.apply(null, ns.map(function(n) { const b=gb(n); return b?b.w:0; }));
  });
  const colX = {};
  let cx = START_X;
  Object.keys(COL).sort().forEach(function(ci) { colX[ci] = cx; cx += colW[ci] + GAP_COL; });
  Object.entries(COL).forEach(function([ci,ns]) { ns.forEach(function(n) { setX(n, colX[ci]); }); });

  // Row 0: 각 컬럼 첫 번째 항목
  ['DbProviderType','DbConfigBase','IDbContext','DbContextBase',
   'InfluxDbContext','MsSqlDbContext','OracleDbContext','MySqlDbContext','SqliteDbContext'
  ].forEach(function(n) { setY(n, START_Y); });

  requestAnimationFrame(function() {
    setY('DbResultStatus',   bot('DbProviderType')   + PAD_STACK);
    setY('RelationalDbConfig', bot('DbConfigBase')   + PAD_STACK);
    setY('IRepositoryT',     bot('IDbContext')        + PAD_STACK);
    setY('RepositoryBaseT',  bot('DbContextBase')     + PAD_STACK);
    setY('InfluxRepositoryT', bot('InfluxDbContext')  + PAD_STACK);
    setY('MsSqlRepositoryT',  bot('MsSqlDbContext')   + PAD_STACK);
    setY('OracleRepositoryT', bot('OracleDbContext')  + PAD_STACK);
    setY('MySqlRepositoryT',  bot('MySqlDbContext')   + PAD_STACK);
    setY('SqliteRepositoryT', bot('SqliteDbContext')  + PAD_STACK);

    requestAnimationFrame(function() {
      setY('DbErrorCode',      bot('DbResultStatus')    + PAD_STACK);
      setY('InfluxDbConfig',   bot('RelationalDbConfig') + PAD_STACK);
      setY('IQueryBuilder',    bot('IRepositoryT')       + PAD_STACK);
      setY('QueryBuilderBase', bot('RepositoryBaseT')    + PAD_STACK);
      setY('LineProtocolBuilder', bot('InfluxRepositoryT') + PAD_STACK);
      setY('MsSqlQueryBuilder',   bot('MsSqlRepositoryT')  + PAD_STACK);
      setY('OracleQueryBuilder',  bot('OracleRepositoryT') + PAD_STACK);
      setY('MySqlQueryBuilder',   bot('MySqlRepositoryT')  + PAD_STACK);
      setY('SqliteQueryBuilder',  bot('SqliteRepositoryT') + PAD_STACK);

      requestAnimationFrame(function() {
        setY('DbParamType',      bot('DbErrorCode')   + PAD_STACK);
        setY('DbConfigException', bot('InfluxDbConfig') + PAD_STACK);
        setY('DbHelper',         bot('IQueryBuilder')  + PAD_STACK);

        requestAnimationFrame(function() {
          setY('QueryOp', bot('DbParamType') + PAD_STACK);
          setY('DbParam', bot('DbConfigException') + PAD_STACK);

          requestAnimationFrame(function() {
            setY('DbResultT', bot('DbParam') + PAD_STACK);

            requestAnimationFrame(function() {
              setY('SpResult', bot('DbResultT') + PAD_STACK);

              requestAnimationFrame(function() {
                setY('DbException', bot('SpResult') + PAD_STACK);
                requestAnimationFrame(function() { drawAll(); });
              });
            });
          });
        });
      });
    });
  });
}); });

function drawAll() {
  const pos = {};
  cv.querySelectorAll('.bw').forEach(function(el) {
    pos[el.dataset.box] = {x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight};
  });
  const maxW = Math.max.apply(null, Object.values(pos).map(function(p){return p.x+p.w;})) + 80;
  const maxH = Math.max.apply(null, Object.values(pos).map(function(p){return p.y+p.h;})) + 100;
  cv.style.minWidth = maxW+'px'; cv.style.minHeight = maxH+'px';
  svgEl.setAttribute('width', maxW); svgEl.setAttribute('height', maxH);
  const ph = document.getElementById('cv-phantom');
  ph.style.width  = Math.ceil(maxW*zl)+'px';
  ph.style.height = Math.ceil(maxH*zl)+'px';

  svgEl.innerHTML = '<defs>' +
    '<marker id="me" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto">' +
    '<path d="M1 1 L11 6 L1 11 Z" fill="white" stroke="#e040fb" stroke-width="2" stroke-linejoin="round"/></marker>' +
    '<marker id="mi" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto">' +
    '<path d="M1 1 L11 6 L1 11 Z" fill="white" stroke="#4f8ef7" stroke-width="2" stroke-linejoin="round"/></marker>' +
    '<marker id="mu" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto">' +
    '<path d="M1 2 L10 6 L1 10" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round"/></marker>' +
    '</defs>';

  FG.forEach(function(fg) {
    const bs = fg.ns.map(function(n){return pos[n];}).filter(Boolean); if(!bs.length) return;
    const pd=14, x1=Math.min.apply(null,bs.map(function(b){return b.x;}))-pd, y1=Math.min.apply(null,bs.map(function(b){return b.y;}))-pd;
    const x2=Math.max.apply(null,bs.map(function(b){return b.x+b.w;}))+pd, y2=Math.max.apply(null,bs.map(function(b){return b.y+b.h;}))+pd;
    const rc=mk('rect'); sa(rc,{x:x1,y:y1,width:x2-x1,height:y2-y1,rx:6,fill:'none',stroke:fg.color,'stroke-width':1.5,'stroke-dasharray':'6,3',opacity:0.75});
    svgEl.appendChild(rc);
    const bg=mk('rect'); sa(bg,{x:x1+2,y:y1-9,width:fg.lbl.length*6.5+12,height:14,rx:3,fill:'white'});
    svgEl.appendChild(bg);
    const tx=mk('text'); sa(tx,{x:x1+8,y:y1+1,'font-size':10,fill:fg.color,'font-family':'monospace','font-weight':700});
    tx.textContent=fg.lbl; svgEl.appendChild(tx);
  });

  function ep(b,e){
    if(e==='top')    return [b.x+b.w/2, b.y];
    if(e==='bottom') return [b.x+b.w/2, b.y+b.h];
    if(e==='left')   return [b.x,        b.y+b.h/2];
    if(e==='right')  return [b.x+b.w,    b.y+b.h/2];
    return [b.x+b.w/2, b.y];
  }

  const SY = {
    ext:  {stroke:'#e040fb','stroke-width':2,  'marker-end':'url(#me)'},
    impl: {stroke:'#4f8ef7','stroke-width':1.5,'stroke-dasharray':'5,3','marker-end':'url(#mi)'},
    uses: {stroke:'#888',   'stroke-width':1.2,'stroke-dasharray':'4,2','marker-end':'url(#mu)'},
  };

  CONN.forEach(function(c) {
    const fb=pos[c.f], tb=pos[c.t]; if(!fb||!tb) return;
    const ep1=ep(fb,c.fe), ep2=ep(tb,c.te);
    const sx=ri(ep1[0]), sy=ri(ep1[1]);
    const tx2=ri(ep2[0]), ty2=ri(ep2[1]);
    const ML=18;
    let ex=tx2, ey=ty2;
    if(c.te==='top')    ey+=ML; else if(c.te==='bottom') ey-=ML;
    else if(c.te==='left') ex+=ML; else if(c.te==='right') ex-=ML;
    const dist=Math.hypot(ex-sx,ey-sy);
    const cp=Math.max(80,dist*0.48);
    const xoff=c.xoff||0;
    let c1x=sx+xoff, c1y=sy, c2x=ex+xoff, c2y=ey;
    if(c.fe==='bottom') c1y+=cp; else if(c.fe==='top') c1y-=cp;
    else if(c.fe==='right') c1x+=cp; else if(c.fe==='left') c1x-=cp;
    if(c.te==='top') c2y-=cp; else if(c.te==='bottom') c2y+=cp;
    else if(c.te==='left') c2x-=cp; else if(c.te==='right') c2x+=cp;
    const d='M'+sx+' '+sy+' C'+ri(c1x)+' '+ri(c1y)+' '+ri(c2x)+' '+ri(c2y)+' '+ex+' '+ey;
    const pa=mk('path'); sa(pa,{d:d,fill:'none',...(SY[c.ty]||SY.uses)});
    svgEl.appendChild(pa);
    if(c.lbl){
      const t=0.5, it=1-t;
      const mx=ri(it*it*it*sx+3*it*it*t*c1x+3*it*t*t*c2x+t*t*t*ex);
      const my=ri(it*it*it*sy+3*it*it*t*c1y+3*it*t*t*c2y+t*t*t*ey);
      const lblCol={ext:'#c000d8',impl:'#1a5cb8',uses:'#555'}[c.ty]||'#555';
      const FSIZE=11, PAD_X=7, PAD_Y=3;
      const aw=c.lbl.length*FSIZE*0.62+PAD_X*2, ah=FSIZE+PAD_Y*2;
      const bg=mk('rect'); sa(bg,{x:mx-aw/2,y:my-ah/2,width:aw,height:ah,rx:4,fill:'white',stroke:lblCol,'stroke-width':1.2,opacity:0.97});
      svgEl.appendChild(bg);
      const tl=mk('text'); sa(tl,{x:mx,y:my,'font-size':FSIZE,fill:lblCol,'font-family':'monospace','font-weight':'700','text-anchor':'middle','dominant-baseline':'central'});
      tl.textContent=c.lbl; svgEl.appendChild(tl);
    }
  });
}

function mk(tag){ return document.createElementNS('http://www.w3.org/2000/svg',tag); }
function sa(el,a){ Object.entries(a).forEach(function([k,v]){el.setAttribute(k,v);}); }

sz(0.52);
</script>
